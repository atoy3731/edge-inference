apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  labels:
    app: frigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frigate/configmap.yaml") . | sha256sum }}
        {{- if .Values.frigate.customModels }}
        checksum/models-config: {{ include (print $.Template.BasePath "/frigate/models-configmap.yaml") . | sha256sum }}
        {{- end }}
      labels:
        app: frigate
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ffmpeg.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.frigate.podSecurityContext | nindent 8 }}
      {{- if or .Values.frigate.customModels .Values.frigate.customLabels }}
      initContainers:
        - name: copy-models
          image: alpine:3.20
          imagePullPolicy: {{ .Values.frigate.pullPolicy }}
          command: 
            - /bin/ash
            - -c
            - |
              #!/bin/ash
              
              apk update && apk add wget
              
              {{- if .Values.frigate.customModels }}
              for model in $(cat /input/models.txt); do
                echo "Downloading model '$model'.."
                wget -P /models/ "$model"
              done
              {{- end }}

              {{- if .Values.frigate.customLabels }}
              for label in $(cat /input/labels.txt); do
                echo "Downloading label '$label'.."
                wget -P /labels/ "$label"
              done
              {{- end }}
          volumeMounts:
          - name: frigate-input
            mountPath: /input
          {{- if .Values.frigate.customModels }}
          - name: frigate-models-dir
            mountPath: /models
          {{- end }}
          {{- if .Values.frigate.customLabels }}
          - name: frigate-labels-dir
            mountPath: /labels
          {{- end }}
      {{- end }}
      containers:
        - name: frigate
          image: "{{ .Values.frigate.image }}:{{ .Values.frigate.tag }}"
          imagePullPolicy: {{ .Values.frigate.pullPolicy }}
          resources:
            limits:
              akri.sh/akri-coral: "1"
          securityContext:
            privileged: true
          ports:
            - name: rtsp
              containerPort: {{ .Values.frigate.rtspPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.frigate.httpPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.frigate.rtspPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.frigate.rtspPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
          - mountPath: "/config/config.yml"
            name: config
            subPath: config.yml
          - mountPath: "/dev/bus/usb"
            name: coral
          {{- if .Values.frigate.persistence.enabled }}
          - mountPath: "/media/frigate"
            name: data
          {{- end }}
          {{- if .Values.frigate.customModels }}
          - name: frigate-models-dir
            mountPath: /models
          {{- end }}
          {{- if .Values.frigate.customLabels }}
          - name: frigate-labels-dir
            mountPath: /labels
          {{- end }}
      volumes:
      - name: config
        configMap:
          name: frigate-config
      - name: coral
        hostPath:
          path: /dev/bus/usb
      {{- if .Values.frigate.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: frigate-pvc
      {{- end }}
      {{- if or .Values.frigate.customModels .Values.frigate.customLabels }}
      - name: frigate-input
        configMap:
          name: frigate-input
      {{- if .Values.frigate.customModels }}
      - name: frigate-models-dir
        emptyDir: {}
      {{- end }}
      {{- if .Values.frigate.customLabels }}
      - name: frigate-labels-dir
        emptyDir: {}
      {{- end }}
      {{- end }}
